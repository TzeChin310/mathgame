<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f5ec" />
    <title>數學勇者｜星星島闖關</title>
    <link rel="stylesheet" href="styles.css?v=20261107-gameplay2" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" defer></script>
    <script src="game.js?v=20261107-gameplay2" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#top" aria-label="數學勇者首頁">
          <span class="brand-mark" aria-hidden="true">＋</span>
          <span class="brand-name">數學勇者</span>
        </a>
        <div class="topbar-note"><span aria-hidden="true">✦</span> 星星島冒險隊</div>
        <button class="restart-button" id="restart-top" type="button" hidden>
          <span aria-hidden="true">↻</span> 重新開始
        </button>
      </header>

      <section class="game-card" aria-label="數學闖關遊戲">
        <div class="game-heading">
          <div class="heading-copy">
            <p class="eyebrow">今天的任務</p>
            <h1>蒐集答案，點亮星星島！</h1>
          </div>
          <div class="score-card" aria-live="polite">
            <span class="score-star" aria-hidden="true">★</span>
            <span><span class="score-label">目前得分</span><strong id="score-value">0</strong><span class="score-unit">分</span></span>
          </div>
        </div>

        <div class="progress-row">
          <div class="level-label"><span class="level-icon" aria-hidden="true">◆</span><span id="level-label">第 1 關</span></div>
          <span class="progress-caption" id="progress-caption">島嶼 1 / 5</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="闖關進度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1" id="progress-bar">
          <span id="progress-fill"></span>
          <span class="progress-stars" aria-hidden="true"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></span>
        </div>

        <div class="question-row">
          <div class="question-badge" aria-hidden="true">?</div>
          <div class="question-copy">
            <p class="question-stage" id="stage-name">加法森林</p>
            <p class="question-text" id="question-text">7 + 5 = ?</p>
          </div>
          <div class="collect-hint"><span aria-hidden="true">✧</span> 找到正確答案星球</div>
        </div>

        <div class="game-window" id="game-window">
          <div id="game-stage" aria-label="遊戲場景，使用方向鍵移動並跳躍蒐集答案"></div>
          <div class="game-overlay" id="game-overlay">
            <div class="overlay-card" id="overlay-card">
              <div class="overlay-art" id="overlay-art" aria-hidden="true">🚀</div>
              <p class="overlay-kicker" id="overlay-kicker">五座島嶼等你探索</p>
              <h2 id="overlay-title">準備好出發了嗎？</h2>
              <p class="overlay-message" id="overlay-message">帶著小勇者跳上平台，碰到正確答案就能前往下一關。</p>
              <div class="scoring-note" id="scoring-note">
                <span>答對 <b>+10 分</b></span><span class="note-dot">·</span><span>答錯 <b>−5 分</b></span>
              </div>
              <button class="primary-button" id="overlay-action" type="button">開始冒險 <span aria-hidden="true">→</span></button>
            </div>
          </div>
        </div>

        <div class="control-row">
          <div class="control-help">
            <span class="control-icon" aria-hidden="true">⌨</span>
            <span>方向鍵 / A、D 移動　<span class="keycap">↑</span> 或 <span class="keycap">空白鍵</span> 跳躍</span>
          </div>
          <div class="touch-controls" aria-label="觸控操作">
            <button class="move-button" id="move-left" type="button" aria-label="向左移動">←</button>
            <button class="move-button" id="move-right" type="button" aria-label="向右移動">→</button>
            <button class="jump-button" id="jump-button" type="button" aria-label="跳躍"><span aria-hidden="true">↑</span> 跳躍</button>
          </div>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      </section>

      <footer class="page-footer"><span>用眼睛找答案，用勇氣跳上去！</span><span>適合國小數學練習</span></footer>
    </main>
  </body>
</html>
